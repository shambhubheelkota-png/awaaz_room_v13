name: Build Awaaz Room APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter Version
        run: flutter --version

      - name: Find Flutter Project
        shell: bash
        run: |
          PUBSPEC=$(find "$GITHUB_WORKSPACE" -name pubspec.yaml -type f -print -quit)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "Flutter project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Get Dependencies
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          echo "Current directory:"
          pwd
          echo "pubspec.yaml:"
          ls -la pubspec.yaml
          flutter pub get

      - name: Build Android APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          echo "Building from:"
          pwd
          flutter build apk --release -t lib/main.dart

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: awaaz-room-apk
          path: "**/build/app/outputs/flutter-apk/app-release.apk"
          if-no-files-found: error
