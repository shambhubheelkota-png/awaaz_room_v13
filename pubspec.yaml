name: awaaz_room
version: 0.1.0+1
description: Cross-platform voice chat room MVP for Android and iOS.
publish_to: none

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Correct WebRTC + LiveKit versions (Compatible with Android SDK 34–36)
  flutter_webrtc: ^1.6.2+hotfix.1
  livekit_client: ^2.5.0+hotfix.3
  socket_io_client: ^3.1.6
  http: ^1.2.2

  # Firebase (SDK 3.3.0 compatible)
  firebase_core: ^4.3.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.1.1
  firebase_messaging: ^16.6.0
  firebase_app_check: ^0.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
