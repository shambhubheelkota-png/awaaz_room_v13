name: awaaz_room
version: 0.1.0+1
description: Cross-platform voice chat room MVP for Android and iOS.
publish_to: none

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Voice + WebRTC + LiveKit (correct versions)
  flutter_webrtc: 0.11.7
  socket_io_client: ^3.1.6
  livekit_client: 2.5.0+hotfix.3
  http: ^1.2.2

  # Firebase (SDK 3.3.0 ke saath compatible)
  cloud_firestore: ^6.1.1
  firebase_app_check: ^0.4.7
  firebase_messaging: ^16.6.0
  firebase_auth: ^6.6.1
  firebase_core: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
