
workflows:
  android-build:
    name: Awaaz Room V13 APK Build
    max_build_duration: 45
    instance_type: mac_mini_m2

    environment:
      flutter: 3.47.2

    scripts:
      - name: Pre-clean & dependencies
        script: |
          flutter clean
          rm -rf ~/.pub-cache
          rm -rf ~/.gradle
          rm -rf android/.gradle
          rm -rf android/build
          flutter pub get

      - name: Build Android APK (Debug)
        script: |
          flutter build apk \
            --debug \
            -t lib/main.dart

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
